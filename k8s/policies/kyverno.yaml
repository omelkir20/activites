apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !(object.metadata.namespace == 'devsecops-portfolio' ||
          object.metadata.namespace.startsWith('portfolio-')) ||
        (
          (object.spec.containers +
           object.spec.?initContainers.orValue([]) +
           object.spec.?ephemeralContainers.orValue([]))
          .all(c,
            image(c.image).containsDigest() ||
            (image(c.image).tag() != '' &&
             image(c.image).tag() != 'latest')
          )
        )
      message: "Le tag latest ou l'absence de tag est interdit. Utilisez un tag explicite ou un digest."

---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !(object.metadata.namespace == 'devsecops-portfolio' ||
          object.metadata.namespace.startsWith('portfolio-')) ||
        (
          (object.spec.containers +
           object.spec.?initContainers.orValue([]) +
           object.spec.?ephemeralContainers.orValue([]))
          .all(c,
            !has(c.securityContext) ||
            !has(c.securityContext.privileged) ||
            c.securityContext.privileged == false
          )
        )
      message: "Les conteneurs privilégiés sont interdits."

---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !(object.metadata.namespace == 'devsecops-portfolio' ||
          object.metadata.namespace.startsWith('portfolio-')) ||
        (
          (
            has(object.spec.securityContext) &&
            has(object.spec.securityContext.runAsNonRoot) &&
            object.spec.securityContext.runAsNonRoot == true
          ) ||
          (
            (object.spec.containers +
             object.spec.?initContainers.orValue([]) +
             object.spec.?ephemeralContainers.orValue([]))
            .all(c,
              has(c.securityContext) &&
              has(c.securityContext.runAsNonRoot) &&
              c.securityContext.runAsNonRoot == true
            )
          )
        )
      message: "runAsNonRoot: true est obligatoire au niveau du Pod ou de chaque conteneur."

---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !(object.metadata.namespace == 'devsecops-portfolio' ||
          object.metadata.namespace.startsWith('portfolio-')) ||
        (
          (object.spec.containers +
           object.spec.?initContainers.orValue([]))
          .all(c,
            has(c.resources) &&
            has(c.resources.requests) &&
            has(c.resources.requests.cpu) &&
            has(c.resources.requests.memory) &&
            has(c.resources.limits) &&
            has(c.resources.limits.memory)
          )
        )
      message: "requests CPU et mémoire, ainsi que limits mémoire, sont obligatoires."
