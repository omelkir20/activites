apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: devsecops-portfolio
data:
  PORT: "4000"
  CORS_ORIGIN: "http://portfolio.local,https://portfolio.local"
  TRUST_PROXY: "1"
  CONTACT_RATE_LIMIT_MAX: "5"
  CONTACT_RATE_LIMIT_WINDOW_MS: "60000"
  POSTGRES_USER: portfolio
  POSTGRES_DB: portfolio
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: devsecops-portfolio
data:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  API_INTERNAL_URL: "http://api:4000"
