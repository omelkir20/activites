apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: portfolio, namespace: devsecops-portfolio}
spec:
  tls:
    - hosts: [portfolio.local]
      secretName: portfolio-tls
  ingressClassName: traefik
  rules:
    - host: portfolio.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: api, port: {number: 4000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 3000}}}
