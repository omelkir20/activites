apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: selfsigned-issuer, namespace: devsecops-portfolio}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: portfolio-ca, namespace: devsecops-portfolio}
spec:
  isCA: true
  commonName: portfolio-ca
  secretName: portfolio-ca-secret
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: selfsigned-issuer, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: portfolio-ca-issuer, namespace: devsecops-portfolio}
spec:
  ca: {secretName: portfolio-ca-secret}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: portfolio-tls, namespace: devsecops-portfolio}
spec:
  secretName: portfolio-tls
  dnsNames: [portfolio.local]
  issuerRef: {name: portfolio-ca-issuer, kind: Issuer}
