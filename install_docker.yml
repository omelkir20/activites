---
- name: Installer Docker
  hosts: all
  become: true
  vars:
    # Surchargeable : -e docker_apt_codename=noble si Docker n'a pas encore de dépôt pour votre release Ubuntu
    docker_apt_codename: "{{ ansible_distribution_release }}"
  tasks:
    - name: Installer les prérequis
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Créer le répertoire des keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Télécharger la clé GPG Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ docker_apt_codename }} stable"
        filename: docker
        state: present
        update_cache: yes

    - name: Installer Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Démarrer et activer Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Autoriser l'utilisateur de connexion à utiliser Docker sans sudo
      user:
        name: "{{ ansible_user | default(ansible_env.SUDO_USER | default('vagrant')) }}"
        groups: docker
        append: yes
