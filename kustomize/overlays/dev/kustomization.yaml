apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-kdev
resources: [../../base]
replicas:
  - {name: api, count: 1}
  - {name: frontend, count: 1}
configMapGenerator:
  - name: frontend-config
    behavior: merge
    literals: [API_URL=http://api.portfolio-kdev.svc.cluster.local:4000]
  - name: api-config
    behavior: merge
    literals: [CORS_ORIGIN=http://portfolio-kdev.local]
patches:
  - target: {kind: Ingress, name: portfolio}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: portfolio-kdev.local}
