apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [20-postgres.yaml, 30-api.yaml, 31-frontend.yaml, 40-services.yaml, 80-rbac.yaml, ingress.yaml]
generatorOptions: {disableNameSuffixHash: true}
configMapGenerator:
  - name: api-config
    literals: [PORT=4000, TRUST_PROXY=1, POSTGRES_USER=portfolio, POSTGRES_DB=portfolio, RATE_LIMIT_MAX=100, CONTACT_RATE_LIMIT_MAX=5]
  - name: frontend-config
    literals: [NODE_ENV=production, API_URL=http://api:4000]
