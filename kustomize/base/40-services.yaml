apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: devsecops-portfolio}
spec:
  selector: {app: frontend}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: devsecops-portfolio}      # le nom "api" = http://api:4000
spec:
  selector: {app: api}
  ports: [{port: 4000, targetPort: 4000}]
