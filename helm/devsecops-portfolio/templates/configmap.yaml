apiVersion: v1
kind: ConfigMap
metadata: {name: api-config}
data:
  POSTGRES_USER: portfolio
  POSTGRES_DB: portfolio
{{- range $k, $v := .Values.config.api }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: frontend-config}
data:
{{- range $k, $v := .Values.config.frontend }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
