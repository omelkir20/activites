{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-pvc}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.postgres.storage }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, labels: {app: postgres}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext:
          runAsNonRoot: true
          runAsUser: 70
          runAsGroup: 70
          fsGroup: 70
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: portfolio}
            - {name: POSTGRES_DB, value: portfolio}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_PASSWORD}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe: {exec: {command: [pg_isready, -U, portfolio, -d, portfolio]}, initialDelaySeconds: 5}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "portfolio.ctrSecurity" . | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
{{- end }}
