apiVersion: apps/v1
kind: Deployment
metadata: {name: api, labels: {app: api}}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext: {{- include "portfolio.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports: [{containerPort: 4000}]
          envFrom: [{configMapRef: {name: api-config}}]
          env:
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_PASSWORD}}}
            - {name: API_KEY, valueFrom: {secretKeyRef: {name: api-secret, key: API_KEY}}}
            - {name: DATABASE_URL, value: "postgresql://portfolio:$(POSTGRES_PASSWORD)@postgres:5432/portfolio?schema=public"}
          readinessProbe: {httpGet: {path: /api/health, port: 4000}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 4000}, initialDelaySeconds: 40, periodSeconds: 20}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "portfolio.ctrSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: api, labels: {app: api}}
spec:
  selector: {app: api}
  ports: [{name: http, port: 4000, targetPort: 4000}]
